{% include "_developer_toolkit_styles.html" %}

<div class="dev-toolkit-page">
  <section class="dev-toolkit-view-card">
    <span class="dev-toolkit-eyebrow">TOOLKIT FILE</span>
    <h2>{{ title }}</h2>
    <div class="dev-toolkit-path">{{ relative_path }}</div>
    <span class="dev-toolkit-language">{{ language_name }}</span>

    <div class="dev-toolkit-view-actions mt-3">
      <a
        href="{{ url_for('portfolio_bp.developer_toolkit') }}"
        class="dev-toolkit-link-button"
        data-load-page>
        <i class="fa fa-arrow-left"></i> 返回工具箱
      </a>
      <button
        type="button"
        class="dev-toolkit-button dev-toolkit-button-primary"
        onclick="navigator.clipboard.writeText(document.getElementById('toolkitCode').innerText).then(() => alert('已複製內容'));">
        <i class="fa fa-copy"></i> 複製內容
      </button>
      <a
        href="{{ url_for('portfolio_bp.developer_toolkit_download', path=relative_path) }}"
        class="dev-toolkit-link-button">
        <i class="fa fa-download"></i> 下載檔案
      </a>
    </div>

    <div class="dev-toolkit-code-shell">
      <pre id="toolkitCode" class="dev-toolkit-code">{{ content }}</pre>
    </div>
  </section>
</div>
