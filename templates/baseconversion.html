<div class="row">
  <div class="col-md-12 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">

        <h4 class="card-title">TriStar 禁制轉換</h4>
        <p class="card-description">請輸入十進制數字，系統會轉換產生八進制數字。</p>

        <form method="post" action="{{ url_for('schoolassignment.baseconversion') }}" onsubmit="return submitPageForm(this);">
          <div class="form-group">
            <label>請輸十進制數字:</label>
            <input type="number" name="num_1" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-primary mt-3">轉換為8進制</button>
        </form>

        <hr>

        {% if result is not none %}
          <p>{{ num_1 }} 轉換後的8進制為：{{ result }}</p>
        {% else %}
          <p class="text-muted">尚未產生星星塔。</p>
        {% endif %}

      </div>
    </div>
  </div>
</div>
