<div class="row">
  <div class="col-md-12 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">

        <h4 class="card-title">TriStar 星星塔</h4>
        <p class="card-description">請輸入層數，系統會產生星星塔。</p>

        <form method="post" action="{{ url_for('schoolassignment.tristar') }}" onsubmit="return submitPageForm(this);">
          <div class="form-group">
            <label>請輸入層數</label>
            <input type="number" name="quantity" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-primary mt-3">產生星星塔</button>
        </form>

        <hr>

        {% if result is not none %}
          <p>層數：{{ quantity }}</p>

          <pre>
        {% for line in result %}
        {{ line }}
        {% endfor %}
          </pre>
        {% else %}
          <p class="text-muted">尚未產生星星塔。</p>
        {% endif %}

      </div>
    </div>
  </div>
</div>
