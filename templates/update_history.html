<div class="site-update-page">
  <section class="site-update-hero">
    <div>
      <span class="site-update-eyebrow">TYY CHANGELOG</span>
      <h2>網站更新紀錄</h2>
      <p>依日期整理新增功能、介面調整、模型優化與錯誤修正。首頁會固定顯示最新一日內容，這裡可以查看完整歷史。</p>
    </div>
    <button type="button" class="site-update-home-button" onclick="loadPage('{{ url_for('home_dashboard') }}');">
      <i class="fa fa-home"></i> 回到主頁
    </button>
  </section>

  <section class="site-update-list">
    {% for update in site_updates %}
    <article class="site-update-list-card">
      <div class="site-update-date-block">
        <span>{{ update.date }}</span>
        {% if loop.first %}<small>最新</small>{% endif %}
      </div>
      <div class="site-update-list-content">
        <h3>{{ update.title }}</h3>
        <ul>
          {% for item in update.summary[:3] %}<li>{{ item }}</li>{% endfor %}
        </ul>
      </div>
      <a href="{{ url_for('update_detail', update_slug=update.slug) }}" class="site-update-open" data-load-page>
        查看內容 <i class="fa fa-angle-right"></i>
      </a>
    </article>
    {% else %}
    <div class="site-update-empty">目前尚無更新公告。</div>
    {% endfor %}
  </section>
</div>
